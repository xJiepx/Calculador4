<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VioletaGlass Music</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar glass">
        <div class="brand">
          <div class="logo">VG</div>
          <div>
            <h1>VioletaGlass</h1>
            <p>Tu sonido en púrpura</p>
          </div>
        </div>
        <nav>
          <button class="nav-item active">Descubrir</button>
          <button class="nav-item">Biblioteca</button>
          <button class="nav-item">Playlists</button>
          <button class="nav-item">Favoritos</button>
        </nav>
        <div class="now-playing">
          <p class="label">Sonando ahora</p>
          <div class="track-card">
            <img id="now-cover" src="" alt="Portada" />
            <div>
              <h3 id="now-title"></h3>
              <p id="now-artist"></p>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="hero glass">
          <div>
            <p class="tag">Mix recomendado</p>
            <h2>Ambientes futuristas para estudiar</h2>
            <p class="subtitle">Sumérgete en tonos lavanda y beats suaves.</p>
            <div class="hero-actions">
              <button class="primary">Reproducir</button>
              <button class="ghost">Guardar mix</button>
            </div>
          </div>
          <div class="hero-art"></div>
        </header>

        <section class="playlist">
          <h3>Tu colección púrpura</h3>
          <div class="tracks" id="track-list"></div>
        </section>
      </main>

      <footer class="player glass">
        <div class="player-track">
          <img id="player-cover" src="" alt="Portada" />
          <div>
            <h4 id="player-title"></h4>
            <p id="player-artist"></p>
          </div>
        </div>
        <div class="player-controls">
          <button id="prev" aria-label="Anterior">⏮</button>
          <button id="play" class="play" aria-label="Reproducir">▶</button>
          <button id="next" aria-label="Siguiente">⏭</button>
        </div>
        <div class="player-progress">
          <span id="current-time">0:00</span>
          <input type="range" id="progress" min="0" max="100" value="0" />
          <span id="duration">0:00</span>
        </div>
        <p id="status" class="status">Listo para reproducir.</p>
      </footer>
    </div>

    <audio id="audio"></audio>
    <script src="script.js"></script>
  </body>
</html>
